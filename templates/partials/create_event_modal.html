<!-- Create Event Modal -->
<div class="modal fade" id="createEventModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create New Event</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form method="post" action="#">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="eventTitle" class="form-label">Event Title</label>
                        <input type="text" class="form-control" id="eventTitle" name="title" placeholder="Give your event a catchy name" required>
                    </div>
                    <div class="mb-3">
                        <label for="eventDescription" class="form-label">Description</label>
                        <textarea class="form-control" id="eventDescription" name="description" rows="3" placeholder="Describe your event" required></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="eventDate" class="form-label">Date</label>
                            <input type="date" class="form-control" id="eventDate" name="date" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="eventTime" class="form-label">Time</label>
                            <input type="time" class="form-control" id="eventTime" name="time" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="eventLocation" class="form-label">Location</label>
                        <input type="text" class="form-control" id="eventLocation" name="location" placeholder="Where is the event happening?" required>
                    </div>
                    <div class="mb-3">
                        <label for="eventTheme" class="form-label">Theme (Optional)</label>
                        <input type="text" class="form-control" id="eventTheme" name="theme" placeholder="e.g., Beach, 80s, Masquerade">
                    </div>
                    <div class="mb-3">
                        <label for="maxAttendees" class="form-label">Maximum Attendees</label>
                        <input type="number" class="form-control" id="maxAttendees" name="max_attendees" min="1" value="20" required>
                    </div>
                    <div class="mb-3">
                        <label for="eventRules" class="form-label">Rules (Optional)</label>
                        <textarea class="form-control" id="eventRules" name="rules" rows="2" placeholder="Any specific rules for your event?"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Privacy Settings</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="privacy" id="publicEvent" value="public" checked>
                            <label class="form-check-label" for="publicEvent">
                                Public - Anyone can see and request to join
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="privacy" id="privateEvent" value="private">
                            <label class="form-check-label" for="privateEvent">
                                Private - Only invited people can join
                            </label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-haha">Create Event</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
